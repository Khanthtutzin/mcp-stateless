name: Deploy site

on:
  push:
    branches: [main]
    # The site renders the repository's own Markdown, so a docs edit has to
    # redeploy it. Working documents under docs/superpowers/ are not published
    # and must not trigger a deploy.
    paths:
      - 'site/**'
      - 'docs/**'
      - '!docs/superpowers/**'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'CHANGELOG.md'
      - 'CODE_OF_CONDUCT.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Pages needs an OIDC identity to deploy, same mechanism as npm publishing.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue rather than cancel so main always wins.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      # The site has its own checks; the root suite does not cover it.
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
