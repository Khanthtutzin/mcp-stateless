name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  # Required for npm trusted publishing: the job mints a short-lived OIDC token
  # that npm exchanges for publish rights. Without this the publish falls back
  # to looking for a credential and fails.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Deliberately NO registry-url. setup-node's registry-url writes an
      # .npmrc containing //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
      # and points NPM_CONFIG_USERCONFIG at it. With no token set that leaves a
      # configured-but-empty credential, and npm takes it as "auth is already
      # handled" — it never falls back to OIDC, sends an unauthenticated PUT,
      # and the registry answers 404. Omitting registry-url is what lets
      # trusted publishing engage.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # The npm bundled with the runner's Node 22 predates OIDC support, and
      # the failure mode is unhelpful: it reports missing auth rather than an
      # unsupported client. Pin a version known to speak trusted publishing.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@^11
          npm --version

      - run: npm ci

      # Never publish something that does not pass its own suite.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run docs:check
      - run: npm test
      - run: npm run build

      - name: Tag must match package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "Tag v$tag does not match package.json version $pkg"
            exit 1
          fi

      # npm rewrites the manifest at publish time more aggressively than at
      # pack time. A `./` prefix on `bin` was silently dropped once, which would
      # have shipped a CLI with no executable. Fail the release instead.
      - name: Manifest must survive npm's publish-time normalisation
        run: |
          if npm publish --dry-run 2>&1 | grep -q "auto-corrected"; then
            echo "::error::npm would rewrite package.json on publish. Run 'npm pkg fix' and commit."
            npm publish --dry-run 2>&1 | grep -A5 "auto-corrected"
            exit 1
          fi
          echo "Manifest is clean."

      # Trusted publishing (OIDC). No NODE_AUTH_TOKEN: authentication is the
      # workflow's own identity, checked against the trusted publisher
      # configured on npm for this package. Provenance is attested
      # automatically, so --provenance is neither needed nor allowed here.
      - name: Publish to npm
        run: npm publish --access public

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true

      # Consumers write `uses: Khanthtutzin/mcp-stateless@v1`, which only works
      # if a `v1` tag exists and keeps moving. Prereleases are excluded: a tag
      # like v1.1.0-rc.1 must never become what `@v1` resolves to. Skipped
      # entirely for 0.x, where no stable major tag should exist yet.
      - name: Move the major version tag
        run: |
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            *-*) echo "Prerelease $tag — not moving a major tag."; exit 0 ;;
            v0.*) echo "Pre-1.0 release $tag — no major tag until 1.0.0."; exit 0 ;;
          esac
          major="${tag%%.*}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$major" "$tag"
          git push origin "refs/tags/$major" --force
          echo "$major now points at $tag."
