version: 2
updates:
  # Only devDependencies exist here — the published package has zero runtime
  # dependencies and that is an invariant worth keeping. Grouped so routine
  # bumps arrive as one reviewable PR rather than five.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # engines is >=20. Each @types/node major types APIs that older Node
      # users do not have, so a major bump is a deliberate decision, not a PR.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript 7 is blocked on typescript-eslint's peer range. Remove this
      # once typescript-eslint supports it, and bump the two together.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: chore

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
